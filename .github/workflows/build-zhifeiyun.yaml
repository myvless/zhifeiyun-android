name: Build 智飞云 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Create / update GitHub Release (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: build-zhifeiyun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # Signing: uses repo secrets when present (stable key => in-place upgrades work).
      # Otherwise generates a throw-away key so the APK still installs.
      # To make upgrades possible later, add secrets:
      #   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "keystore.password=$SIGNING_STORE_PASSWORD"
              echo "key.alias=$SIGNING_KEY_ALIAS"
              echo "key.password=$SIGNING_KEY_PASSWORD"
            } > signing.properties
          else
            echo "::warning::No signing secrets - generating an ephemeral keystore. Users must uninstall before installing a build signed with a different key."
            rm -f release.keystore
            PASS="zfy$(openssl rand -hex 12)"
            keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore \
              -alias zhifeiyun -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Zhifeiyun, OU=App, O=Zhifeiyun, C=CN"
            {
              echo "keystore.password=$PASS"
              echo "key.alias=zhifeiyun"
              echo "key.password=$PASS"
            } > signing.properties
          fi

      - name: Build meta release
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: List outputs
        run: ls -la app/build/outputs/apk/meta/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: zhifeiyun-apk
          path: app/build/outputs/apk/meta/release/*.apk
          if-no-files-found: error

      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'versionName = ' build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: GitHub Release
        if: ${{ github.event_name == 'push' || inputs.release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 智飞云 v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            智飞云 Android v${{ steps.ver.outputs.version }}
            - 推荐下载 `*-arm64-v8a-*.apk`（绝大多数手机）；不确定就下载 `*-universal-*.apk`。
            - 基于开源项目 [ClashMetaForAndroid](https://github.com/MetaCubeX/ClashMetaForAndroid)（MetaCubeX，GPL-3.0）与 mihomo 内核。
          files: app/build/outputs/apk/meta/release/*.apk
          overwrite_files: true
